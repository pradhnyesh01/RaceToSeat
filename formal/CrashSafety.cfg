INVARIANT SeatBelongsToAtMostOne
INVARIANT SeatStatusAgrees
INVARIANT Atomicity
INVARIANT HoldConfirmedAtMostOnce
INVARIANT NoConfirmOnExpired
INVARIANT ReapOnlyExpired
INVARIANT KeyAtMostOneBooking
INVARIANT KeyAtMostOneHold
INVARIANT NoOrphanState
INVARIANT CommittedPersists
INVARIANT CleanConflict
