<svg xmlns="http://www.w3.org/2000/svg" width="900" height="452" viewBox="0 0 900 452" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Cross-seat isolation degradation against the 10% threshold</title>
<desc>Horizontal bars, one per Mechanism and the Control, showing how much a hot seat degrades the p99 latency of bookings for unrelated seats. A dashed line marks the 10% threshold; each bar is labelled PASS or FAIL.</desc>
<defs>
<pattern id="pat-fail" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#D55E00"/><path d="M-1 7L7 -1M-1 1L1 -1M5 7L7 5" stroke="#000000" stroke-width="1.6"/></pattern>
</defs>
<rect width="900" height="452" fill="#ffffff"/>
<text x="40" y="28" font-size="18" text-anchor="start" fill="#1a1a1a" font-weight="bold">Cross-seat isolation: degradation against the 10% threshold</text>
<text x="40" y="48" font-size="11" text-anchor="start" fill="#555555">Exhibit E (NFR2). Background-stream p99 with a hot seat, relative to the background-only baseline; each Mechanism at the widened connection configuration.</text>
<text x="40" y="64" font-size="11" text-anchor="start" fill="#555555">Lower is better; strictly under 10% passes, so exactly 10.0% fails.</text>
<rect fill="#56B4E9" x="40" y="80" width="18" height="12" stroke="#222222" stroke-width="1"/>
<text x="64" y="90" font-size="12" text-anchor="start" fill="#1a1a1a">PASS: under the 10% threshold</text>
<rect fill="url(#pat-fail)" x="300" y="80" width="18" height="12" stroke="#222222" stroke-width="1"/>
<text x="324" y="90" font-size="12" text-anchor="start" fill="#1a1a1a">FAIL: at or over the 10% threshold</text>
<text x="700" y="114" font-size="12" text-anchor="end" fill="#1a1a1a" font-weight="bold">Degradation</text>
<text x="790" y="114" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="bold">Pass (&lt;10%)?</text>
<line x1="270" y1="124" x2="270" y2="392" stroke="#d9d9d9" stroke-width="1"/>
<text x="270" y="408" font-size="10" text-anchor="middle" fill="#555555">-75%</text>
<line x1="326.7" y1="124" x2="326.7" y2="392" stroke="#d9d9d9" stroke-width="1"/>
<text x="326.7" y="408" font-size="10" text-anchor="middle" fill="#555555">-50%</text>
<line x1="383.3" y1="124" x2="383.3" y2="392" stroke="#d9d9d9" stroke-width="1"/>
<text x="383.3" y="408" font-size="10" text-anchor="middle" fill="#555555">-25%</text>
<line x1="440" y1="124" x2="440" y2="392" stroke="#d9d9d9" stroke-width="1"/>
<text x="440" y="408" font-size="10" text-anchor="middle" fill="#555555">0%</text>
<line x1="496.7" y1="124" x2="496.7" y2="392" stroke="#d9d9d9" stroke-width="1"/>
<text x="496.7" y="408" font-size="10" text-anchor="middle" fill="#555555">25%</text>
<line x1="553.3" y1="124" x2="553.3" y2="392" stroke="#d9d9d9" stroke-width="1"/>
<text x="553.3" y="408" font-size="10" text-anchor="middle" fill="#555555">50%</text>
<line x1="610" y1="124" x2="610" y2="392" stroke="#d9d9d9" stroke-width="1"/>
<text x="610" y="408" font-size="10" text-anchor="middle" fill="#555555">75%</text>
<line x1="440" y1="124" x2="440" y2="392" stroke="#444444" stroke-width="1"/>
<line x1="462.7" y1="124" x2="462.7" y2="392" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="462.7" y="108" font-size="11" text-anchor="middle" fill="#1a1a1a" font-weight="bold">10% threshold</text>
<text x="440" y="430" font-size="11" text-anchor="middle" fill="#555555">Degradation of background p99 vs. background-only baseline (%)</text>
<text x="256" y="154" font-size="12" text-anchor="end" fill="#1a1a1a">naive (Control, with Backstop)</text>
<rect data-mechanism="naive" data-verdict="PASS" x="296.3" y="136" width="143.7" height="28" fill="#56B4E9" stroke="#222222" stroke-width="1"/>
<text x="700" y="154" font-size="13" text-anchor="end" fill="#1a1a1a" font-weight="bold">-63.4%</text>
<text x="790" y="154" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">✓ PASS</text>
<text x="256" y="198" font-size="12" text-anchor="end" fill="#1a1a1a">unique_constraint</text>
<rect data-mechanism="unique_constraint" data-verdict="PASS" x="396.8" y="180" width="43.2" height="28" fill="#56B4E9" stroke="#222222" stroke-width="1"/>
<text x="700" y="198" font-size="13" text-anchor="end" fill="#1a1a1a" font-weight="bold">-19.1%</text>
<text x="790" y="198" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">✓ PASS</text>
<text x="256" y="242" font-size="12" text-anchor="end" fill="#1a1a1a">pessimistic</text>
<rect data-mechanism="pessimistic" data-verdict="PASS" x="409.1" y="224" width="30.9" height="28" fill="#56B4E9" stroke="#222222" stroke-width="1"/>
<text x="700" y="242" font-size="13" text-anchor="end" fill="#1a1a1a" font-weight="bold">-13.6%</text>
<text x="790" y="242" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">✓ PASS</text>
<text x="256" y="286" font-size="12" text-anchor="end" fill="#1a1a1a">optimistic</text>
<rect data-mechanism="optimistic" data-verdict="FAIL" x="440" y="268" width="136.2" height="28" fill="url(#pat-fail)" stroke="#222222" stroke-width="1"/>
<text x="700" y="286" font-size="13" text-anchor="end" fill="#1a1a1a" font-weight="bold">+60.1%</text>
<text x="790" y="286" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">✗ FAIL</text>
<text x="256" y="330" font-size="12" text-anchor="end" fill="#1a1a1a">advisory</text>
<rect data-mechanism="advisory" data-verdict="PASS" x="435.3" y="312" width="4.7" height="28" fill="#56B4E9" stroke="#222222" stroke-width="1"/>
<text x="700" y="330" font-size="13" text-anchor="end" fill="#1a1a1a" font-weight="bold">-2.1%</text>
<text x="790" y="330" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">✓ PASS</text>
<text x="256" y="374" font-size="12" text-anchor="end" fill="#1a1a1a">serializable</text>
<rect data-mechanism="serializable" data-verdict="PASS" x="359.4" y="356" width="80.6" height="28" fill="#56B4E9" stroke="#222222" stroke-width="1"/>
<text x="700" y="374" font-size="13" text-anchor="end" fill="#1a1a1a" font-weight="bold">-35.5%</text>
<text x="790" y="374" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">✓ PASS</text>
</svg>
